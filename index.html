<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b31">
  <meta name="description" content="AYDA A1 ders tekrarı: 24 ünite, ders videoları ve interaktif Almanca alıştırmaları. Öğrenciler için sade çalışma alanı.">
  <meta property="og:title" content="AYDA A1 | Ders Tekrarı">
  <meta property="og:description" content="Üniteni seç, videonu izle ve soruları çöz.">
  <link rel="icon" type="image/png" href="./og.png">
  <title>AYDA A1 Akademi | Video, Konu Anlatımı ve Alıştırmalar</title>
  <link rel="stylesheet" href="./assets/base.css">
  <link rel="stylesheet" href="./assets/study.css">
  <style>
    /* Original AYDA external classroom-password verification retained. */
    #aydaProtectedContent {display:none}
    #aydaLoginBox{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;overflow-y:auto;min-height:100vh;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:#f3f6fc;color:#183356;font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
    #aydaLoginBox .ayda-login-card{background:#fff;border:1px solid #dce6f4;box-shadow:0 20px 50px rgba(23,52,102,.14);width:min(100%,420px);padding:clamp(23px,5vw,34px);border-radius:24px}
    #aydaLoginBox .ayda-login-logo{background:#0b1b31;border-radius:12px;width:174px;height:74px;display:grid;place-items:center;margin:0 auto 18px;padding:10px}#aydaLoginBox .ayda-login-logo img{display:block;max-width:100%;height:auto;object-fit:contain}
    #aydaLoginBox h1{text-align:center;color:#163664;font-size:clamp(25px,6vw,30px);line-height:1.2;letter-spacing:-.03em;margin:0 0 10px}
    #aydaLoginBox p{text-align:center;color:#63718a;font-size:15px;line-height:1.6;margin:0 0 24px}
    #aydaLoginBox .ayda-password-row{display:grid;grid-template-columns:1fr;gap:12px}
    #aydaPasswordInput{display:block;min-width:0;width:100%;min-height:58px;background:#f8fbff;border:2px solid #d6e1ef;padding:13px 16px;border-radius:13px;color:#173358;font-size:16px;outline:none}
    #aydaPasswordInput:focus{border-color:#386da9;box-shadow:0 0 0 4px rgba(35,78,143,.10)}
    #aydaLoginBox .ayda-login-btn{background:#244e8c;border:0;color:white;border-radius:13px;cursor:pointer;font-weight:850;font-size:17px;min-height:58px;padding:13px}
    #aydaLoginBox .ayda-login-btn:focus-visible{outline:3px solid #f7bb54;outline-offset:3px}
    #aydaLoginMessage{font-size:13px;font-weight:700;min-height:17px;color:#b43a43;margin-top:11px;text-align:center}
    @media(max-width:350px){#aydaLoginBox .ayda-login-card{padding:20px;border-radius:18px}}
    @media(max-height:480px) and (orientation:landscape){#aydaLoginBox{place-items:start center}}
  </style>
  <script type="module" src="./assets/app-ayda-a1.js"></script>
</head>
<body>
<section id="aydaLoginBox" aria-label="AYDA öğrenci girişi">
  <div class="ayda-login-card">
    <div class="ayda-login-logo"><img src="./assets/ayda-logo.png" alt="AYDA Dil Akademisi" width="142" height="48"></div>
    <h1>A1 Ders Tekrarı</h1>
    <p>A1 video derslerine, konu anlatımlarına ve alıştırmalarına başlamak için sınıf şifreni yaz.</p>
    <form class="ayda-password-row" onsubmit="aydaCheckPassword(); return false;">
      <input id="aydaPasswordInput" name="aydaClassPassword" type="password" placeholder="Sınıf şifren" autocomplete="off" aria-label="Sınıf şifresi" aria-describedby="aydaLoginMessage" required>
      <button class="ayda-login-btn" type="submit">Öğrenmeye Başla →</button>
    </form>
    <div id="aydaLoginMessage" role="status" aria-live="polite"></div>
  </div>
</section>
<div id="aydaProtectedContent"><div id="root"></div></div>
<script src="https://onurqlp.github.io/ayda-pass/access-control.js" onerror="document.getElementById('aydaLoginMessage').textContent='Giriş sistemi yüklenemedi. İnternet bağlantını kontrol et.'"></script>
</body>
</html>
